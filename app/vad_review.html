<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MorningTalk Local Audio Review</title>
  <style>
    :root {
      color-scheme: light;
      font: 14px/1.35 "Segoe UI", sans-serif;
      color: #17212b;
      background: #f3f6f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 0; }
    header { background: #123b55; color: white; padding: .55rem 1rem; }
    h1 { margin: 0; font-size: 1.1rem; line-height: 1.25; }
    main {
      display: grid;
      grid-template-columns: minmax(215px, 1fr) minmax(0, 3fr);
      gap: .65rem;
      padding: .65rem;
    }
    section, aside {
      min-width: 0;
      padding: .7rem;
      border: 1px solid #d5dfe6;
      border-radius: 6px;
      background: white;
    }
    h2 { margin: .1rem 0 .35rem; font-size: 1.08rem; line-height: 1.3; }
    label { display: block; margin: .38rem 0 .18rem; font-weight: 600; }
    select, input, button { font: inherit; }
    select, input {
      max-width: 100%;
      min-width: 0;
      padding: .32rem .42rem;
      border: 1px solid #aebdc8;
      border-radius: 4px;
      background: white;
    }
    button {
      min-height: 34px;
      padding: .32rem .52rem;
      border: 0;
      border-radius: 4px;
      background: #17648c;
      color: white;
      cursor: pointer;
      white-space: nowrap;
    }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid #1577a8;
      outline-offset: 1px;
    }
    button:disabled { opacity: .45; cursor: default; }
    button.secondary { background: #526a78; }
    .browser select { width: 100%; }
    .segment-list {
      margin-top: .55rem;
      max-height: min(52vh, 500px);
      overflow-x: hidden;
      overflow-y: auto;
      border-top: 1px solid #d5dfe6;
      scrollbar-gutter: stable;
    }
    .segment-row {
      display: grid;
      grid-template-columns: minmax(62px, .7fr) minmax(0, 2fr) auto;
      gap: .32rem;
      align-items: center;
      min-width: 0;
      padding: .32rem .2rem;
      border-bottom: 1px solid #e8edf0;
      font-size: .84rem;
    }
    .segment-row strong, .segment-row .time { min-width: 0; overflow-wrap: anywhere; }
    .segment-row.active { background: #e8f4fa; }
    .segment-row button { min-height: 30px; padding: .25rem .42rem; }
    .segment-row .merge-badge { grid-column: 1 / 3; grid-row: 2; justify-self: start; }
    .segment-row .lineage { grid-column: 1 / 3; grid-row: 3; color: #536977; overflow-wrap: anywhere; }
    .merge-badge { padding: .08rem .35rem; border-radius: 99px; background: #e9edf0; color: #425563; font-size: .76rem; }
    .segment-row.merged { background-image: linear-gradient(90deg, #fff5dc, transparent 75%); }
    .segment-row.merged .merge-badge { background: #ffe2a5; color: #684300; }
    .toolbar, .boundaries, .context { display: flex; flex-wrap: wrap; gap: .4rem; align-items: end; }
    .toolbar { margin: .65rem 0; }
    .toolbar > label { display: flex; align-items: center; gap: .3rem; margin: 0; white-space: nowrap; }
    .toolbar select { min-width: 5rem; }
    .boundaries {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      margin-top: .6rem;
    }
    .boundaries label, .context label { margin: 0; }
    .boundaries input { display: block; width: 100%; }
    .context { display: grid; grid-template-columns: repeat(2, minmax(0, max-content)); }
    .context input { width: 5.5rem; }
    .status { margin: .35rem 0; color: #536977; font-size: .88rem; }
    .alignment {
      display: inline-block;
      padding: .18rem .48rem;
      border-radius: 99px;
      background: #fff1ce;
      color: #6d4a00;
      font-size: .84rem;
    }
    audio { display: none; }
    #message { min-height: 1.2rem; margin: .45rem 0 0; color: #8a2c20; font-size: .88rem; }
    @media (max-width: 800px) {
      main { grid-template-columns: minmax(0, 1fr); }
      .segment-list { max-height: 38vh; }
    }
    @media (max-width: 560px) {
      header { padding: .5rem .7rem; }
      main { gap: .5rem; padding: .5rem; }
      section, aside { padding: .6rem; }
      .segment-row { grid-template-columns: minmax(0, 1fr) auto; gap: .25rem; font-size: .82rem; }
      .segment-row .time { grid-column: 1; }
      .segment-row button { grid-column: 2; grid-row: 1 / span 2; }
      .context { grid-template-columns: minmax(0, 1fr); }
      .context label { display: flex; align-items: center; justify-content: space-between; gap: .3rem; }
      .boundaries { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .boundaries #save { grid-column: 1 / -1; justify-self: start; }
      .toolbar { gap: .3rem; }
      .toolbar button { padding-inline: .42rem; }
    }
  </style>
</head>
<body>
  <header><h1>MorningTalk — Local Audio Review</h1></header>
  <main>
    <aside class="browser">
      <label for="vad-mode">Segmentation</label>
      <select id="vad-mode">
        <option value="original" selected>Original VAD (244)</option>
        <option value="optimized">Optimized VAD (219)</option>
      </select>
      <label for="plant">Plant</label><select id="plant"></select>
      <label for="month">Month</label><select id="month"></select>
      <label for="recording">Recording</label><select id="recording"></select>
      <p id="recording-info" class="status"></p>
      <div id="segments" class="segment-list" aria-label="Review segments"></div>
    </aside>
    <section>
      <h2 id="segment-title">Select a recording and segment</h2>
      <p id="segment-info" class="status"></p>
      <p id="segment-source" class="status"></p>
      <span class="alignment">Transcript: Not aligned</span>
      <div class="toolbar">
        <button id="previous" class="secondary" disabled>Previous</button>
        <button id="play" disabled>Play</button>
        <button id="replay" class="secondary" disabled>Replay</button>
        <button id="next" class="secondary" disabled>Next</button>
        <label>Speed
          <select id="speed"><option>0.75</option><option selected>1</option><option>1.25</option></select>
        </label>
      </div>
      <div class="context">
        <label>Context before (sec)<input id="before" type="number" min="0" max="60" step="0.25" value="0"></label>
        <label>Context after (sec)<input id="after" type="number" min="0" max="60" step="0.25" value="0"></label>
      </div>
      <div class="boundaries">
        <label>Start (ms)<input id="start" type="number" min="0" step="10"></label>
        <label>End (ms)<input id="end" type="number" min="0" step="10"></label>
        <button id="save" class="secondary" disabled>Save timing adjustment</button>
      </div>
      <p id="message" role="status"></p>
      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { recordings: [], recording: null, selected: -1, mode: "original", playbackStart: 0, playbackEnd: 0 };
    const audio = $("audio");
    const modeQuery = () => `mode=${encodeURIComponent(state.mode)}`;
    const msTime = (ms) => {
      const total = ms / 1000;
      const minutes = Math.floor(total / 60);
      return `${minutes}:${(total - minutes * 60).toFixed(2).padStart(5, "0")}`;
    };
    const currentSegment = () => state.recording?.segments[state.selected] || null;
    const setMessage = (text = "") => { $("message").textContent = text; };

    function groups(preferredRecordingId = null) {
      const plants = [...new Set(state.recordings.map((item) => item.plant))].sort();
      $("plant").replaceChildren(...plants.map((value) => new Option(value, value)));
      const preferred = state.recordings.find((item) => item.recording_id === preferredRecordingId);
      if (preferred) $("plant").value = preferred.plant;
      updateMonths(preferred?.month, preferredRecordingId);
    }
    function updateMonths(preferredMonth = null, preferredRecordingId = null) {
      const months = [...new Set(state.recordings.filter((item) => item.plant === $("plant").value).map((item) => item.month))].sort();
      $("month").replaceChildren(...months.map((value) => new Option(value, value)));
      if (months.includes(preferredMonth)) $("month").value = preferredMonth;
      updateRecordings(preferredRecordingId);
    }
    function updateRecordings(preferredRecordingId = null) {
      const items = state.recordings.filter((item) => item.plant === $("plant").value && item.month === $("month").value);
      $("recording").replaceChildren(...items.map((item) => new Option(item.recording, item.recording_id)));
      if (items.some((item) => item.recording_id === preferredRecordingId)) {
        $("recording").value = preferredRecordingId;
      }
      loadRecording();
    }
    async function loadCatalog(preferredRecordingId = null) {
      try {
        const response = await fetch(`/api/recordings?${modeQuery()}`);
        if (!response.ok) throw new Error("Unable to load recording browser.");
        state.recordings = (await response.json()).recordings;
        groups(preferredRecordingId);
      } catch (error) { setMessage(error.message); }
    }
    function clearSelection() {
      $("segment-title").textContent = "Select a recording and segment";
      $("segment-info").textContent = "";
      $("segment-source").textContent = "";
      $("play").disabled = $("replay").disabled = $("save").disabled = true;
      $("previous").disabled = $("next").disabled = true;
    }
    async function loadRecording() {
      const id = $("recording").value;
      state.selected = -1;
      state.recording = null;
      audio.pause();
      $("play").textContent = "Play";
      $("segments").replaceChildren();
      if (!id) { $("recording-info").textContent = ""; clearSelection(); return; }
      try {
        const response = await fetch(`/api/recordings/${encodeURIComponent(id)}?${modeQuery()}`);
        if (!response.ok) throw new Error("Unable to load recording.");
        state.recording = await response.json();
        $("recording-info").textContent = `${state.mode === "original" ? "Original" : "Optimized"} · ${state.recording.segments.length} segments · ${msTime(state.recording.audio_duration_ms)}`;
        audio.src = `/api/recordings/${encodeURIComponent(id)}/audio?${modeQuery()}`;
        const fragment = document.createDocumentFragment();
        state.recording.segments.forEach((segment, index) => {
          const row = document.createElement("div");
          row.className = "segment-row";
          if (state.mode === "optimized") {
            row.classList.add(segment.merge_status === "merged" ? "merged" : "unchanged");
          }
          row.dataset.index = index;
          const idText = document.createElement("strong");
          idText.textContent = segment.segment_id;
          const time = document.createElement("span");
          time.className = "time";
          time.textContent = `${msTime(segment.start_ms)}–${msTime(segment.end_ms)} · ${((segment.end_ms - segment.start_ms) / 1000).toFixed(2)} s`;
          const select = document.createElement("button");
          select.type = "button";
          select.textContent = "Select";
          select.addEventListener("click", () => selectSegment(index));
          row.append(idText, time, select);
          if (state.mode === "optimized") {
            const badge = document.createElement("span");
            badge.className = "merge-badge";
            badge.textContent = segment.merge_status === "merged"
              ? `Merged · ${segment.source_segment_ids.length} source segments`
              : "Unchanged";
            row.append(badge);
            if (segment.merge_status === "merged") {
              const lineage = document.createElement("span");
              lineage.className = "lineage";
              lineage.textContent = `Source IDs: ${segment.source_segment_ids.join(", ")}`;
              row.append(lineage);
            }
          }
          fragment.append(row);
        });
        $("segments").append(fragment);
        if (state.recording.segments.length) selectSegment(0);
        else clearSelection();
      } catch (error) { setMessage(error.message); }
    }
    function selectSegment(index) {
      if (!state.recording || index < 0 || index >= state.recording.segments.length) return;
      audio.pause();
      $("play").textContent = "Play";
      state.selected = index;
      const segment = currentSegment();
      $("segment-title").textContent = segment.segment_id;
      $("segment-info").textContent = `${msTime(segment.start_ms)}–${msTime(segment.end_ms)} · ${((segment.end_ms - segment.start_ms) / 1000).toFixed(2)} seconds`;
      $("segment-source").textContent = state.mode === "optimized"
        ? `${segment.merge_status === "merged" ? "Merged from" : "Unchanged from"} source segment${segment.source_segment_ids.length === 1 ? "" : "s"}: ${segment.source_segment_ids.join(", ")}`
        : `Original source segment: ${segment.segment_id}`;
      $("start").value = segment.start_ms;
      $("end").value = segment.end_ms;
      [...$("segments").children].forEach((row) => row.classList.toggle("active", Number(row.dataset.index) === index));
      $("play").disabled = $("replay").disabled = $("save").disabled = false;
      $("previous").disabled = index === 0;
      $("next").disabled = index === state.recording.segments.length - 1;
      setMessage("");
    }
    async function getPlaybackBounds(segment) {
      const before = Number($("before").value);
      const after = Number($("after").value);
      if (![before, after].every((value) => Number.isFinite(value) && value >= 0 && value <= 60)) {
        throw new Error("Context must be between 0 and 60 seconds.");
      }
      const query = new URLSearchParams({ before: String(before), after: String(after) });
      query.set("mode", state.mode);
      const url = `/api/recordings/${state.recording.recording_id}/segments/${segment.segment_id}/playback?${query}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("Unable to validate playback range.");
      return response.json();
    }
    async function playSegment(replay = false) {
      const segment = currentSegment();
      if (!segment) return;
      try {
        const bounds = await getPlaybackBounds(segment);
        state.playbackStart = bounds.start_ms / 1000;
        state.playbackEnd = bounds.end_ms / 1000;
        audio.playbackRate = Number($("speed").value);
        if (!replay && !audio.paused) { audio.pause(); $("play").textContent = "Play"; return; }
        audio.currentTime = state.playbackStart;
        await audio.play();
        $("play").textContent = "Pause";
        setMessage("");
      } catch (error) { setMessage(error.message); }
    }
    audio.addEventListener("timeupdate", () => {
      if (!audio.paused && audio.currentTime >= state.playbackEnd) {
        audio.pause();
        $("play").textContent = "Play";
      }
    });
    audio.addEventListener("ended", () => { $("play").textContent = "Play"; });
    $("plant").addEventListener("change", () => updateMonths());
    $("month").addEventListener("change", updateRecordings);
    $("recording").addEventListener("change", loadRecording);
    $("vad-mode").addEventListener("change", () => {
      const previousRecordingId = $("recording").value;
      state.mode = $("vad-mode").value;
      loadCatalog(previousRecordingId);
    });
    $("play").addEventListener("click", () => playSegment());
    $("replay").addEventListener("click", () => playSegment(true));
    $("previous").addEventListener("click", () => selectSegment(state.selected - 1));
    $("next").addEventListener("click", () => selectSegment(state.selected + 1));
    $("speed").addEventListener("change", () => { audio.playbackRate = Number($("speed").value); });
    $("save").addEventListener("click", async () => {
      const segment = currentSegment();
      const start = Number($("start").value);
      const end = Number($("end").value);
      if (!segment || !Number.isInteger(start) || !Number.isInteger(end) || start < 0 || end <= start || end > state.recording.audio_duration_ms) {
        setMessage("Enter valid integer millisecond boundaries within the recording.");
        return;
      }
      try {
        const response = await fetch(`/api/recordings/${state.recording.recording_id}/segments/${segment.segment_id}?mode=${encodeURIComponent(state.mode)}`, {
          method: "PATCH", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start_ms: start, end_ms: end })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Unable to save timing.");
        Object.assign(segment, result);
        selectSegment(state.selected);
        const row = $("segments").children[state.selected];
        row.querySelector(".time").textContent = `${msTime(start)}–${msTime(end)} · ${((end - start) / 1000).toFixed(2)} s`;
        setMessage("Timing adjustment saved separately; original VAD timestamps are preserved.");
      } catch (error) { setMessage(error.message); }
    });
    loadCatalog();
  </script>
</body>
</html>
